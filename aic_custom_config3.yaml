# Custom single-trial engine config generated from your manual launch parameters.
# Run with:
#   /entrypoint.sh ground_truth:=true start_aic_engine:=true gazebo_gui:=true \
#     aic_engine_config_file:=/home/mk/aic_custom_sc_engine_config.yaml

# List of topics to subscribe.
scoring:
  topics:
    - topic:
        name: "/joint_states"
        type: "sensor_msgs/msg/JointState"
    - topic:
        name: "/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/tf_static"
        type: "tf2_msgs/msg/TFMessage"
        latched: true
    - topic:
        name: "/scoring/tf"
        type: "tf2_msgs/msg/TFMessage"
    - topic:
        name: "/aic/gazebo/contacts/off_limit"
        type: "ros_gz_interfaces/msg/Contacts"
    - topic:
        name: "/fts_broadcaster/wrench"
        type: "geometry_msgs/msg/WrenchStamped"
    - topic:
        name: "/aic_controller/joint_commands"
        type: "aic_control_interfaces/msg/JointMotionUpdate"
    - topic:
        name: "/aic_controller/pose_commands"
        type: "aic_control_interfaces/msg/MotionUpdate"
    - topic:
        name: "/scoring/insertion_event"
        type: "std_msgs/msg/String"
    - topic:
        name: "/aic_controller/controller_state"
        type: "aic_control_interfaces/msg/ControllerState"

task_board_limits:
  nic_rail:
    min_translation: -0.0215
    max_translation: 0.0234
  sc_rail:
    min_translation: -0.06
    max_translation: 0.055
  mount_rail:
    min_translation: -0.09425
    max_translation: 0.09425

trials:
  trial_1:
    scene:
      task_board:
        pose:
          x: 0.119
          y: 0.178
          z: 1.14
          roll: 0.0
          pitch: 0.0
          yaw: 0.273

        # Manual launch mapping:
        # nic_card_mount_0_present:=true nic_card_mount_0_translation:=-0.0011
        nic_rail_0:
          entity_present: true
          entity_name: "nic_card_0"
          entity_pose:
            translation: -0.0011
            roll: 0.0
            pitch: 0.0
            yaw: 0.0

        # nic_card_mount_1_present:=true nic_card_mount_1_translation:=-0.0146
        nic_rail_1:
          entity_present: true
          entity_name: "nic_card_1"
          entity_pose:
            translation: -0.0146
            roll: 0.0
            pitch: 0.0
            yaw: 0.0

        # nic_card_mount_2_present:=true nic_card_mount_2_translation:=0.0056
        nic_rail_2:
          entity_present: true
          entity_name: "nic_card_2"
          entity_pose:
            translation: 0.0056
            roll: 0.0
            pitch: 0.0
            yaw: 0.0

        nic_rail_3:
          entity_present: false
        nic_rail_4:
          entity_present: false

        # sc_port_0_present:=false sc_rail_0_present:=false
        sc_rail_0:
          entity_present: false

        # sc_port_1_present:=true sc_rail_1_present:=true sc_port_1_translation:=-0.0561
        # The task target_module_name below is "sc_port_1"; the entity_name here
        # follows the engine sample_config naming convention.
        sc_rail_1:
          entity_present: true
          entity_name: "sc_mount_1"
          entity_pose:
            translation: -0.0561
            roll: 0.0
            pitch: 0.0
            yaw: 0.0

        # Not specified / disabled in your launch command.
        lc_mount_rail_0:
          entity_present: false
        sfp_mount_rail_0:
          entity_present: false
        sc_mount_rail_0:
          entity_present: false
        lc_mount_rail_1:
          entity_present: false
        sfp_mount_rail_1:
          entity_present: false
        sc_mount_rail_1:
          entity_present: false

      cables:
        # Manual launch mapping:
        # spawn_cable:=true cable_type:=sfp_sc_cable_reversed attach_cable_to_gripper:=true
        # Using cable_0 here is intentional: the task below also uses cable_0.
        cable_0:
          pose:
            gripper_offset:
              x: 0.0
              y: 0.015385
              z: 0.04045
            roll: 0.4432
            pitch: -0.4838
            yaw: 1.3303
          attach_cable_to_gripper: true
          cable_type: "sfp_sc_cable_reversed"

    tasks:
      task_1:
        cable_type: "sfp_sc"
        cable_name: "cable_0"
        plug_type: "sc"
        plug_name: "sc_tip"
        port_type: "sc"
        port_name: "sc_port_base"
        target_module_name: "sc_port_1"
        time_limit: 300

robot:
  home_joint_positions:
    shoulder_pan_joint: 0.0
    shoulder_lift_joint: -1.5708
    elbow_joint: 0.0
    wrist_1_joint: -1.5708
    wrist_2_joint: 0.0
    wrist_3_joint: 0.0


# aic_custom_config3.yaml Make the param change to the yaml file based on these detials /entrypoint.sh spawn_task_board:=true task_board_x:=0.123 task_board_y:=0.147 task_board_z:=1.14 task_board_roll:=0.0 task_board_pitch:=0.0 task_board_yaw:=1.525 nic_card_mount_0_present:=false nic_card_mount_0_translation:=0.0144 nic_card_mount_1_present:=true nic_card_mount_1_translation:=-0.018 nic_card_mount_2_present:=false nic_card_mount_2_translation:=0.0044 nic_card_mount_3_present:=false nic_card_mount_3_translation:=0.0095 nic_card_mount_4_present:=false nic_card_mount_4_translation:=0.0147 sc_port_0_present:=true sc_rail_0_present:=true sc_port_0_translation:=0.0461 sc_port_1_present:=true sc_rail_1_present:=true sc_port_1_translation:=0.0048 sfp_mount_rail_0_present:=false spawn_cable:=true cable_type:=sfp_sc_cable_reversed attach_cable_to_gripper:=true ground_truth:=true start_aic_engine:=false